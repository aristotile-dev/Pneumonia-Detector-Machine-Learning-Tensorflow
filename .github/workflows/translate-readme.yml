name: Translate README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-readme
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Translate README
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/scripts/translate_readme.py

      - name: Commit translations
        run: |
          git config user.name "Aristotile S"
          git config user.email "336882711+aristotile-dev@users.noreply.github.com"
          git add docs/translations README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update README translations"
            git push
          fi
